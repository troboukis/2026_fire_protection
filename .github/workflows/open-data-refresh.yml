name: Open Data Refresh

on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-data-refresh
  cancel-in-progress: false

jobs:
  export-open-data:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database driver
        run: python -m pip install psycopg2-binary==2.9.11

      - name: Validate database connection secret
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is required for the open-data export."
            exit 1
          fi

      - name: Export public CSV files
        run: python scripts/export_open_data.py

      - name: Commit and push changed exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/open_data
          if git diff --cached --quiet; then
            echo "Open-data exports are unchanged"
            exit 0
          fi
          git commit -m "chore(data): refresh open data exports"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
