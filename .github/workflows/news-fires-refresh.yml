name: News Fires Refresh

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - news-fires-refresh

permissions:
  contents: write

concurrency:
  group: news-fires-refresh
  cancel-in-progress: false

jobs:
  refresh-news-fires:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is required for news_fires refresh."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY secret is required for news_fires area extraction."
            exit 1
          fi
          if [ -z "${GOOGLE_GEOCODING_API_KEY}" ]; then
            echo "GOOGLE_GEOCODING_API_KEY secret is required for news_fires geocoding."
            exit 1
          fi
          case "${DATABASE_URL}" in
            DATABASE_URL=*)
              echo "DATABASE_URL secret must contain only the raw connection string, not 'DATABASE_URL=...'."
              exit 1
              ;;
          esac

      - name: Show news_fires state status
        run: |
          if [ -f logs/news_fires_state.json ]; then
            echo "news_fires_state.json found in checkout"
          else
            echo "news_fires_state.json not found"
          fi

      - name: Refresh news fires
        run: |
          mkdir -p logs
          python src/fetch_news_fires.py

      - name: Commit and push news_fires state
        if: always() && hashFiles('logs/news_fires_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/news_fires_state.json
          if git diff --cached --quiet; then
            echo "No news_fires state changes to commit"
            exit 0
          fi
          git commit -m "chore(data): update news fires state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
