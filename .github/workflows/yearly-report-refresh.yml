name: Yearly Report Refresh

# Rebuilds /analysis/yearly_report every day until the end of 2026. The builder only
# reads the database (one READ ONLY transaction); the job commits the regenerated report
# files and the push to main deploys the site. The last run is on 1 January 2027, so that
# 31 December is complete; later runs stop unless forced by hand.

on:
  schedule:
    - cron: "40 20 * * *"
  workflow_run:
    workflows: ["Daily Data Refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild after 1/1/2027 as well (the period stays 1/1/2026 to 31/12/2026)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: yearly-report-refresh
  cancel-in-progress: false

jobs:
  window:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - name: Check the reporting window
        id: window
        env:
          FORCE: ${{ inputs.force }}
        run: |
          today="$(TZ=Europe/Athens date +%F)"
          if [[ "$today" > "2027-01-01" && "$FORCE" != "true" ]]; then
            echo "The 2026 report is final ($today); nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync branch to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database driver
        run: python -m pip install psycopg2-binary==2.9.11

      - name: Validate database connection secret
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is required for the yearly report."
            exit 1
          fi

      - name: Build the yearly report (read-only database access)
        run: python scripts/reports/yearly-report-2026/build_yearly_report.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Check that the page builds with the new data
        working-directory: app
        run: |
          npm ci
          npx tsc -p tsconfig.app.json --noEmit
          npx vitest run src/features/analysis/yearly-report

      - name: Commit and push the refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/features/analysis/yearly-report/data/yearlyReport2026.generated.json data/reports/yearly-report-2026
          if git diff --cached --quiet; then
            echo "Yearly report is unchanged"
            exit 0
          fi
          git commit -m "chore(data): refresh yearly report 2026"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
