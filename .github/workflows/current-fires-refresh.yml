name: Current Fires Refresh

on:
  schedule:
    - cron: "43 4-21 * * *"
  workflow_dispatch:
 
permissions:
  contents: write

concurrency:
  group: current-fires-refresh
  cancel-in-progress: false

jobs:
  refresh-current-fires:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
      NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync branch to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt beautifulsoup4 lxml

      - name: Validate required secrets
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is required for current_fires refresh."
            exit 1
          fi
          if [ -z "${NASA_FIRMS_MAP_KEY}" ]; then
            echo "NASA_FIRMS_MAP_KEY secret is required for FIRMS active fire refresh."
            exit 1
          fi
          if [ -z "${GOOGLE_GEOCODING_API_KEY}" ]; then
            echo "GOOGLE_GEOCODING_API_KEY secret is required for current_fires geocoding."
            exit 1
          fi
          if [ -z "${X_BEARER_TOKEN}" ]; then
            echo "X_BEARER_TOKEN secret is required for reading @112Greece."
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY secret is required for 112 notice extraction."
            exit 1
          fi
          case "${DATABASE_URL}" in
            DATABASE_URL=*)
              echo "DATABASE_URL secret must contain only the raw connection string, not 'DATABASE_URL=...'."
              exit 1
              ;;
          esac

      - name: Refresh current fires
        continue-on-error: true
        run: python src/scrape_forest_fires.py

      - name: Refresh NASA FIRMS active fires
        continue-on-error: true
        run: python src/fetch_firms_active_fires.py --skip-on-fetch-error

      - name: Refresh 112 notices
        run: |
          mkdir -p logs
          python src/fetch_112_greece.py
